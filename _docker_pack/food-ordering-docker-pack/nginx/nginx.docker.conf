worker_processes auto;

events {
    worker_connections 2048;
}

http {
    upstream user_service {
        server user-service:3000;
        keepalive 16;
    }

    upstream restaurant_service {
        server restaurant-service:3001;
        keepalive 16;
    }

    upstream order_service {
        server order-service-1:3002 max_fails=1 fail_timeout=5s;
        server order-service-2:3012 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    upstream payment_service {
        server payment-service:3003;
        keepalive 16;
    }

    upstream notification_service {
        server notification-service:3004;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        location = /health {
            default_type text/plain;
            return 200 "API Gateway is running\n";
        }

        location ^~ /auth {
            proxy_pass http://user_service;
        }

        location ^~ /users {
            proxy_pass http://user_service;
        }

        location ^~ /restaurants {
            proxy_pass http://restaurant_service;
        }

        location ^~ /orders {
            proxy_pass http://order_service;
            add_header X-Upstream-Server $upstream_addr always;
        }

        location ^~ /payments {
            proxy_pass http://payment_service;
        }

        location ^~ /notifications {
            proxy_pass http://notification_service;
        }

        location / {
            return 404;
        }
    }
}
