
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    # Docker embedded DNS
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 1s;

    # 1. User Service
    upstream user_service {
        zone user_service 64k;
        server user-service:3000 resolve;
        keepalive 16;
    }

    # 2. Restaurant Service
    upstream restaurant_service {
        zone restaurant_service 64k;
        server restaurant-service:3001 resolve;
        keepalive 16;
    }

    # 3. Order Service - 2 instances
    upstream order_service {
        zone order_service 64k;

        server order-service-1:3002 resolve
            max_fails=1 fail_timeout=5s;

        server order-service-2:3012 resolve
            max_fails=1 fail_timeout=5s;

        keepalive 32;
    }

    # 4. Payment Service
    upstream payment_service {
        zone payment_service 64k;
        server payment-service:3003 resolve;
        keepalive 16;
    }

    # 5. Notification Service
    upstream notification_service {
        zone notification_service 64k;
        server notification-service:3004 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # Timeout chung
        proxy_connect_timeout 1s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Health check của API Gateway
        location = /health {
            default_type text/plain;
            return 200 "API Gateway is running\n";
        }

        # User Service: không tự động retry
        location ^~ /auth {
            proxy_pass http://user_service;
            proxy_next_upstream off;
        }

        location ^~ /users {
            proxy_pass http://user_service;
            proxy_next_upstream off;
        }

        # Restaurant Service: không tự động retry
        location ^~ /restaurants {
            proxy_pass http://restaurant_service;
            proxy_next_upstream off;
        }

        # Order Service: cho phép Failover
        location ^~ /orders {
            proxy_pass http://order_service;

            proxy_connect_timeout 1s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;

            add_header X-Upstream-Server $upstream_addr always;
        }

        # Payment Service: không tự động retry
        location ^~ /payments {
            proxy_pass http://payment_service;
            proxy_next_upstream off;
        }

        # Notification Service: không tự động retry
        location ^~ /notifications {
            proxy_pass http://notification_service;
            proxy_next_upstream off;
        }

        location / {
            return 404;
        }
    }
}
